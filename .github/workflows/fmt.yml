name: Format

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: |
          go fmt ./...
          git diff --exit-code
